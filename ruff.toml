target-version = "py39"
line-length = 88

[lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "ANN", "A", "BLE", "C90", "DTZ", "ERA", "EXE", "G", "ISC", "PIE", "PT", "PTH", "Q", "RET", "RUF", "S", "TID", "TCH", "YTT", "SLF", "INP", "PERF", "NPY", "ARG", "TRY", "EM", "PLE", "PGH003", "PGH004", "PLC0206", "PLC0207"]
ignore = [
    "ANN401",
    # Complexity metrics flag the propagator APIs, validation dispatch and
    # numerical update loops. A threshold alone does not justify splitting
    # these algorithms or replacing explicit public keywords with config
    # objects. Review structure directly; do not treat this exception as
    # evidence that a complex function is correct.
    "C901",
    # Unused-argument exceptions are scoped below. Reviewing the former
    # global suppression found an ignored gradient-sampling argument in the
    # OOM estimate and several obsolete internal arguments, now corrected.
    # Keep validation messages beside their conditions (TRY003/EM101/EM102).
    # TRY301 permits validators to translate conversion and explicit domain
    # failures through one error path; extracting a helper only to relocate
    # a raise would not improve that contract. TRY004 remains enabled, with
    # site exceptions only for internal invariant assertions.
    "TRY003",
    "TRY301",
    "EM101",
    "EM102",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# SLF001 (private member access) is expected throughout the test suite: it is
# a white-box test of deepwave's internal modules (`_common`, `_engine`,
# `_backend_utils`, `_staggered_grid`), not a design smell to fix per-site.
"tests/**.py" = ["ANN", "S101", "PT028", "INP001", "SLF001", "ARG001", "ARG002", "ARG005"]
# test_adjoint_symbolic.py deliberately quotes C kernel source verbatim in
# comments next to each transcribed expression (the point of the audit is that
# the transcription is auditable), which ERA001 misreads as commented-out code.
"tests/test_adjoint_symbolic.py" = ["ANN", "S101", "PT028", "INP001", "ERA001"]

# These helpers are invoked and finish inside the same loop iteration; none
# escape with a late-bound loop variable. Restrict the exception to the files
# inspected for those lifetimes, so new tests retain the closure safety check.
"tests/test_capabilities.py" = ["B023"]
"tests/test_elastic.py" = ["B023"]
"tests/test_example_training_review.py" = ["B023"]
"tests/test_release_repairs.py" = ["B023"]
"tests/test_scalar_born.py" = ["B023"]
"tests/test_vti_oblique_interface.py" = ["B023"]
"tests/test_vti_physics.py" = ["B023"]

# These modules implement uniform propagator/transform callbacks. Remaining
# unused positions include ndim, storage_path, fd_coeffs, torch.func rule inputs,
# and backward context outputs. _common also retains public legacy eps keywords.
# Keep other modules, including checkpointing and memory planning, checked.
"src/deepwave/_common.py" = ["ARG001"]
"src/deepwave/_engine.py" = ["ARG001"]
"src/deepwave/_staggered_grid.py" = ["ARG001"]
"src/deepwave/acoustic.py" = ["ARG001", "ARG004"]
"src/deepwave/acoustic_vti.py" = ["ARG001"]
"src/deepwave/elastic.py" = ["ARG001", "ARG004"]
"src/deepwave/elastic_born.py" = ["ARG001"]
"src/deepwave/elastic_vti.py" = ["ARG001"]
"src/deepwave/scalar.py" = ["ARG001", "ARG004", "ARG005"]
"src/deepwave/scalar_born.py" = ["ARG001", "ARG005"]
"src/deepwave/viscoacoustic.py" = ["ARG001"]
# Pytest supplies this hook argument even when only the report is needed.
"scripts/_release_pytest_plugin.py" = ["ARG002"]
