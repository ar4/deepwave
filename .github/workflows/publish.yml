name: Publish accepted distributions

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Accepted successful Build and test run ID
        required: true
        type: string
      build_attempt:
        description: Accepted run attempt (must be the current completed attempt)
        required: true
        type: string
      release_tag:
        description: Existing version tag on master history, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-deepwave
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ar4/deepwave' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      # Only trusted master code runs here. No OIDC in this job.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install twine
      - name: Validate source, required gates, explicit artifact IDs and exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python -m scripts.prepare_publication --run-id "$BUILD_RUN_ID"
          --attempt "$BUILD_ATTEMPT" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: distributions
        with:
          name: validated-distributions-a${{ github.run_attempt }}
          path: accepted/publish/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-evidence-a${{ github.run_attempt }}
          path: accepted/evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Save release summary
        run: cat accepted/evidence/sha256sums.txt >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: github.repository == 'ar4/deepwave' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepwave
    permissions:
      actions: read
      id-token: write
    steps:
      # No checkout, rebuild or execution of downloaded repository scripts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Publish the validated distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # verified release/v1
        with:
          packages-dir: dist/
